<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fullscreen iFrame</title>
    <style>
        /* Remove default browser margins and padding */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevents double scrollbars */
        }

        /* Force the iframe to fill the entire viewport */
        iframe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: none;
            display: block; /* Removes default inline spacing */
        }
    </style>
</head>
<body>

    <!-- The fullscreen iframe -->
    <iframe src="https://shadowcrystal.dev/DEVICE_KNIGHT/" allow="fullscreen" allowfullscreen></iframe>

</body>
</html>
